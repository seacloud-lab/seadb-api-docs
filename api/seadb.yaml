openapi: 3.0.3
info:
  title: SeaDB API
  description: |-
    SeaDB (ScaleDB) API reference for querying data and managing bases, schemas and users.
    See the Authentication reference page for Basic, ApiKey and JWT authentication.
  version: '1.0'

servers:
  - url: https://{server}
    variables:
      server:
        default: seadb.example.com
        description: SeaDB server hostname.

x-readme:
  explorer-enabled: true
  metrics-enabled: false
  proxy-enabled: false

security:
  - BasicAuth: []
  - APIKeyAuth: []
  - JWTAuth: []

tags:
  - name: Authentication
    description: Manage API keys and obtain base JWTs using Basic or ApiKey authentication.
  - name: Bases
    description: Base management, metadata and statistics.
  - name: Users
    description: User administration and base associations.
  - name: Data
    description: SQL queries and row operations.
  - name: Tables
    description: Table management operations.
  - name: Columns
    description: Column management operations.
  - name: Single/Multiple Select Options
    description: Single-select and multiple-select option management operations.
  - name: Indexes
    description: Index management operations.
  - name: System
    description: Health checks and administrative monitoring.

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: Standard Base64 encoding of username:password. With curl, use --user "$SEADB_USERNAME:$SEADB_PASSWORD".
    APIKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Enter the complete header value: ApiKey <encoded>. encoded is unpadded URL-safe Base64 of key_id:key, returned when creating the key.'
    JWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT for the base being accessed. Send it in the Authorization header as
        `Authorization: Bearer <JWT>`.

  parameters:
    base_id:
      name: base_id
      in: path
      required: true
      description: >-
        Base UUID or assigned name. Use `template` to manage the current user's
        template tables; this alias requires Basic or ApiKey authentication.
      schema:
        type: string

  schemas:
    Error:
      type: object
      required:
        - error_message
      properties:
        error_message:
          type: string
          description: Error message returned by SeaDB.
      additionalProperties: true

    Success:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true

    QueryRequest:
      type: object
      required:
        - sql
      properties:
        sql:
          type: string
          description: SQL statement; maximum 1 MiB of UTF-8 bytes.
          example: SELECT * FROM `Table1` LIMIT 10
        parameters:
          type: array
          description: Values for positional `?` parameters; placeholders substitute values, not identifiers. Supported values include null, booleans, numbers, strings and string arrays.
          items: {}
        convert_keys:
          type: boolean
          default: false
          description: >-
            Use column names as result keys and convert select-option IDs to names.
            By default column keys are used for result keys and select columns return option IDs.

    QueryMetadata:
      type: object
      properties:
        id:
          type: string
          description: >-
            Key used to access this column's cell in a result row object.
            Its format depends on query type and `convert_keys`:
            - Standard SELECT: column key by default (`convert_keys: false`); column name when `convert_keys: true`.
            - JOIN query: 4-digit index (`0000`, `0001`, ...) by default (`convert_keys: false`); `table_name.column_name` when `convert_keys: true`.
        key:
          type: string
          description: Internal column key (or expression text/alias).
        name:
          type: string
          description: Column name (or alias).
        type:
          type: string
          description: Column type.
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: Column-specific metadata; may be null.
        table_id:
          type: string
          description: Internal table identifier.
        table_name:
          type: string
          description: Table name.
        base_id:
          type: string
          description: Base UUID.
      additionalProperties: true

    QueryResponse:
      type: object
      required:
        - success
        - results
        - metadata
        - is_join_stmt
      properties:
        success:
          type: boolean
        error_message:
          type: string
        results:
          description: SELECT returns an array of rows; DML and most DDL return null. SQL CREATE INDEX returns an object containing task_id.
          oneOf:
            - type: array
              nullable: true
              items: {type: object, additionalProperties: true}
            - type: object
              properties:
                task_id: {type: string}
        metadata:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/QueryMetadata'
        is_join_stmt:
          type: boolean

    InsertRowsRequest:
      type: object
      required:
        - rows
      properties:
        table_id:
          type: string
          description: Table ID; takes precedence over table_name. Required if table_name is omitted.
        table_name:
          type: string
          description: Table name; required if table_id is omitted.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/Row'
        replace:
          type: boolean
          default: false
          description: Replace a row matched by a unique index instead of inserting a new row.

    InsertRowsResponse:
      type: object
      properties:
        inserted_row_count:
          type: integer
        pks:
          type: array
          nullable: true
          items:
            type: integer
        error_message:
          type: string

    Row:
      type: object
      description: A row whose keys are column names.
      additionalProperties: true

    UpdateRowsRequest:
      type: object
      required:
        - updates
      properties:
        table_id:
          type: string
          description: Table ID; takes precedence over table_name. Required if table_name is omitted.
        table_name:
          type: string
          description: Table name; required if table_id is omitted.
        updates:
          type: array
          maxItems: 1000
          description: >-
            Array of row updates. In each object, `pk` is the row's `_pk` field,
            and `row` contains the column names and values to update.
          items:
            type: object
            required:
              - pk
              - row
            properties:
              pk:
                type: integer
                minimum: 0
                description: Built-in primary key (`_pk`) of the row to update.
              row:
                $ref: '#/components/schemas/Row'

    DeleteRowsRequest:
      type: object
      required:
        - pks
      properties:
        table_id:
          type: string
          description: Table ID; takes precedence over table_name. Required if table_name is omitted.
        table_name:
          type: string
          description: Table name; required if table_id is omitted.
        pks:
          type: array
          maxItems: 10000
          items:
            type: integer
            minimum: 0

    DeleteRowsResponse:
      type: object
      required:
        - deleted_rows
      properties:
        deleted_rows:
          type: integer
          description: Number of deleted rows.

    TableIdentifier:
      type: object
      description: Identify a table by ID or name. ID is tried first; name is a fallback if the ID does not resolve.
      properties:
        table_id:
          type: string
          description: Table ID; takes precedence over table_name. Required if table_name is omitted.
        table_name:
          type: string
          description: Table name; required if table_id is omitted.

    CreateTableRequest:
      type: object
      required:
        - table_name
      properties:
        table_name:
          type: string
        template_table_name:
          type: string
          description: >-
            Name of the template table whose schema the new table uses. When
            set, the new table is bound to the specific template table.

    CreateTableResponse:
      type: object
      required:
        - table_id
      properties:
        table_id:
          type: string

    RenameTableRequest:
      allOf:
        - $ref: '#/components/schemas/TableIdentifier'
        - type: object
          required:
            - new_table_name
          properties:
            new_table_name:
              type: string

    CreateColumnRequest:
      allOf:
        - $ref: '#/components/schemas/TableIdentifier'
        - type: object
          required:
            - column_name
            - column_type
          properties:
            column_name:
              type: string
            column_type:
              type: string
              enum:
                - text
                - int64
                - float64
                - float32
                - bool
                - datetime
                - single-select
                - multiple-select
                - list
            column_data:
              type: object
              description: >-
                Configuration object for column types that support options or settings:
                - `single-select`, `multiple-select`: `options` (array of objects), where each object defines an option with `id` (unique string), `name` (string), and optional attributes (`color`, `text_color`).
                - `text`: `compressed` (boolean, optional), set `true` to enable text compression.
              additionalProperties: true

    CreateColumnResponse:
      type: object
      required:
        - column_key
      properties:
        column_key:
          type: string

    ColumnIdentifier:
      allOf:
        - $ref: '#/components/schemas/TableIdentifier'
        - type: object
          properties:
            column_key:
              type: string
              description: Column key; takes precedence over column_name. Required if column_name is omitted.
            column_name:
              type: string
              description: Column name; required if column_key is omitted.

    UpdateColumnRequest:
      allOf:
        - $ref: '#/components/schemas/ColumnIdentifier'
        - type: object
          properties:
            new_column_name:
              type: string
            update_column_data:
              type: object
              description: >-
                Configuration object containing fields to update for the column. Only supplied fields are updated.
                Supported fields depend on column type; see `column_data` in create column for details.
              additionalProperties: true

    CopyColumnRequest:
      allOf:
        - $ref: '#/components/schemas/TableIdentifier'
        - type: object
          required:
            - src_column_name
            - dst_column_name
          properties:
            src_column_name:
              type: string
            dst_column_name:
              type: string

    CopyColumnResponse:
      type: object
      required:
        - column_key
      properties:
        column_key:
          type: string

    OptionIdentifier:
      allOf:
        - $ref: '#/components/schemas/ColumnIdentifier'
        - type: object
          properties:
            option_id:
              type: string
              description: Option ID; required if option_name is omitted.
            option_name:
              type: string
              description: Option name; required if option_id is omitted.

    OptionData:
      type: object
      description: >-
        Custom styling and visual properties for a select option:
        - `color`: Hex color code for the option background.
        - `text_color`: Hex color code for the option text.
      properties:
        color:
          type: string
          description: Hex color code for the option background.
          pattern: '^#[A-Fa-f0-9]{6}$'
          example: '#4ECCCB'
        text_color:
          type: string
          description: Hex color code for the option text.
          pattern: '^#[A-Fa-f0-9]{6}$'
          example: '#FFFFFF'
      additionalProperties: true

    CreateOptionRequest:
      allOf:
        - $ref: '#/components/schemas/ColumnIdentifier'
        - type: object
          required:
            - option_name
          properties:
            option_name:
              type: string
              description: Display name of the option to create.
            option_data:
              $ref: '#/components/schemas/OptionData'

    CreateOptionResponse:
      type: object
      required:
        - option_id
      properties:
        option_id:
          type: string

    DeleteOptionsRequest:
      allOf:
        - $ref: '#/components/schemas/ColumnIdentifier'
        - type: object
          description: Provide at least one of option_id, option_name, option_ids, or option_names.
          properties:
            option_id:
              type: string
              description: Single option ID to delete; provide at least one of option_id, option_name, option_ids, or option_names.
            option_name:
              type: string
              description: Single option name to delete.
            option_ids:
              type: array
              description: Option IDs to delete.
              items:
                type: string
            option_names:
              type: array
              description: Option names to delete.
              items:
                type: string

    UpdateOptionRequest:
      allOf:
        - $ref: '#/components/schemas/OptionIdentifier'
        - type: object
          properties:
            new_option_name:
              type: string
              description: New display name for the option.
            update_option_data:
              $ref: '#/components/schemas/OptionData'

    CreateIndexRequest:
      type: object
      required:
        - table_id
        - columns
      properties:
        table_id:
          type: string
        name:
          type: string
          description: Optional index name, unique within the base; _pk is reserved.
        columns:
          type: array
          minItems: 1
          uniqueItems: true
          description: Column names in index order; duplicates are not allowed.
          items:
            type: string
        sync:
          type: boolean
          default: false
          description: Create the index synchronously when true.
        unique:
          type: boolean
          default: false
          description: Require unique values, including null; repeated nulls violate uniqueness.

    CreateIndexResponse:
      type: object
      required:
        - task_id
        - success
      properties:
        success: {type: boolean, example: true}
        task_id:
          type: string
          description: Task ID for asynchronous creation; empty for synchronous creation.

    DeleteIndexRequest:
      type: object
      required:
        - table_id
        - index_id
      properties:
        table_id:
          type: string
        index_id:
          type: string

    APIKey:
      type: object
      required: [key_id, key_name, creation, expiration]
      properties:
        key_id: {type: string, example: api_37b4fe1a-9db9-4c13-8157-c6e6326d69ad}
        key_name: {type: string, example: automation}
        creation: {type: integer, format: int64, description: Unix timestamp in seconds.}
        expiration: {type: integer, format: int64, description: Unix timestamp in seconds; -1 means no expiration., example: -1}
    CreatedAPIKey:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required: [key, encoded]
          properties:
            key: {type: string, description: Plaintext secret returned only at creation.}
            encoded: {type: string, description: 'Unpadded URL-safe Base64 of key_id:key. Send Authorization with the value ApiKey <encoded>.'}
    JWTRequest:
      type: object
      required: [tables, permissions]
      properties:
        tables:
          type: array
          minItems: 1
          description: Table-name patterns; * matches any sequence of characters. Use ["*"] for all tables.
          items: {type: string}
          example: [Table1]
        permissions:
          type: array
          minItems: 1
          description: 'Applies to all matching tables: read for queries, read-write for data writes, all for schema management.'
          items: {type: string, enum: [read, read-write, all]}
          example: [read-write]
    User:
      type: object
      required: [username, roles]
      properties:
        username: {type: string, example: user_example}
        roles:
          type: array
          items: {type: string, enum: [admin, default_role]}
          example: [default_role]
    CreateUserRequest:
      type: object
      required: [password]
      properties:
        username: {type: string, description: 'If omitted or empty, generates user_ followed by a UUID with hyphens removed.'}
        password: {type: string, minLength: 1, format: password, description: Required nonempty password; stored as an Argon2id hash.}
        roles:
          type: array
          description: Defaults to ["default_role"] when omitted or empty.
          items: {type: string, enum: [admin, default_role]}
    UpdateUserRequest:
      type: object
      required: [username]
      properties:
        username: {type: string, minLength: 1}
        password: {type: string, minLength: 1, format: password}
        roles:
          type: array
          minItems: 1
          description: Nonempty roles replaces the existing role list. An empty list does not clear roles.
          items: {type: string, enum: [admin, default_role]}
    BaseStatistics:
      type: object
      properties:
        id: {type: string, format: uuid}
        storage: {type: number, description: Cached storage usage in bytes.}
        rows: {type: number, description: Cached total row count.}
        tables:
          type: array
          description: Included by base-info when table statistics exist; omitted by the base list.
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              rows: {type: number}
    ColumnMetadata:
      type: object
      properties:
        key: {type: string}
        name: {type: string}
        type: {type: string}
        data: {type: object, nullable: true, additionalProperties: true, description: Type-specific column data.}
      additionalProperties: true
    TableMetadata:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        format_version: {type: integer}
        dtable_format_version: {type: integer}
        template_base_id: {type: string}
        template_table_id: {type: string}
        template_version: {type: integer, format: int64}
        columns:
          type: array
          items: {$ref: '#/components/schemas/ColumnMetadata'}
        custom_columns:
          type: array
          items: {$ref: '#/components/schemas/ColumnMetadata'}
        indexes:
          type: object
          additionalProperties:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              columns: {type: array, items: {type: string}, description: 'Column keys in index order, not column names.'}
              unique: {type: boolean}
            additionalProperties: true
      additionalProperties: true
    BaseMetadata:
      type: object
      properties:
        storage: {type: string, pattern: '^[0-9]+$', description: Storage usage in bytes encoded as a JSON string., example: '1024'}
        tables:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/TableMetadata'}
    IndexTask:
      type: object
      properties:
        task_id: {type: string, format: uuid}
        table_id: {type: string}
        columns: {type: array, items: {type: string}, description: Column names.}
        status: {type: string, enum: [waiting, running, success, failure]}
    ActiveRequest:
      type: object
      properties:
        request_id: {type: string, format: uuid}
        user_id: {type: string, description: SeaDB username.}
        start: {type: string, format: date-time}
        dtable_id: {type: string, description: Base UUID; empty for account/system operations.}
        info: {type: string}
        duration: {type: number, description: Elapsed seconds.}

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Invalid credentials or insufficient permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict with another transaction.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooLarge:
      description: Row-operation limit exceeded (1000 updates or 10000 primary keys for deletion).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Timeout:
      description: Request timeout.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Configured server-wide requests-per-minute limit exceeded. This middleware returns plain text.
      content:
        text/plain:
          schema: {type: string, example: too many requests}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /api/v1/users/api_keys:
    post:
      tags: [Authentication]
      operationId: createApiKey
      summary: Create an API key
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      description: Create an API key with the current user's permissions. Save key or encoded; they are only returned at creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_name]
              properties:
                key_name: {type: string, minLength: 1, description: Display name for the key.}
                expire_time: {type: integer, format: int64, default: -1, description: Absolute Unix timestamp in seconds. Omitted or nonpositive means no expiration.}
            example: {key_name: automation, expire_time: -1}
      responses:
        '200':
          description: Newly created credential. Preserve key or encoded now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedAPIKey'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    get:
      tags: [Authentication]
      operationId: listApiKeys
      summary: List API keys
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      description: List the current user's keys, including expired keys. Secrets are not returned.
      responses:
        '200':
          description: Key metadata; an empty list is [].
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/APIKey'}}
              example: [{key_id: api_37b4fe1a-9db9-4c13-8157-c6e6326d69ad, key_name: automation, creation: 1777346265, expiration: -1}]
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Authentication]
      operationId: deleteApiKeys
      summary: Delete API keys
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      description: Delete the current user's keys. Administrators may delete any user's keys. Unknown or inaccessible IDs are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, items: {type: string}}
            example: {ids: [api_37b4fe1a-9db9-4c13-8157-c6e6326d69ad]}
      responses:
        '200':
          description: IDs actually deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_ids: {type: array, items: {type: string}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/{base_id}/jwt-token:
    post:
      tags: [Authentication]
      operationId: obtainJwtToken
      summary: Obtain a base JWT
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      parameters: [{$ref: '#/components/parameters/base_id'}]
      description: Obtain a base JWT valid for 72 hours. Base owner or administrator only. Use the token with Bearer authentication on data and schema APIs.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JWTRequest'}
            example: {tables: [Table1], permissions: [read-write]}
      responses:
        '200':
          description: Base-scoped JWT.
          content:
            application/json:
              schema: {type: object, required: [jwt_token], properties: {jwt_token: {type: string}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}

  /api/v1/users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      description: Create a user. Administrator only. Duplicate usernames and unknown roles return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
            example: {username: user_example, password: replace-with-a-password, roles: [default_role]}
      responses:
        '200':
          description: Username and assigned roles; password is never returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      tags: [Users]
      operationId: updateUser
      summary: Update a user
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      description: Update a user's password and/or roles. Administrator only. Empty values leave existing settings unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRequest'}
            example: {username: user_example, roles: [default_role]}
      responses:
        '200': {description: Updated successfully; empty body.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a user
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      description: Delete a user, their credentials and associations. Administrator only. Base data is retained.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [username], properties: {username: {type: string}}}
            example: {username: user_example}
      responses:
        '200': {description: Deleted successfully; empty body.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      description: List users in creation order. Administrator only.
      parameters:
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, description: Omitted or nonpositive uses 100., schema: {type: integer, minimum: 1, default: 100}}
      responses:
        '200':
          description: User list.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/User'}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/users/bases:
    get:
      tags: [Users]
      operationId: listUserBases
      summary: List the current user's bases
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      description: List base UUIDs associated with the current user, including for administrator accounts.
      responses:
        '200':
          description: Base UUID list.
          content:
            application/json:
              schema: {type: array, items: {type: string, format: uuid}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}

  /api/v1/stats:
    get:
      tags: [Bases]
      operationId: getSystemStatistics
      summary: Get system base statistics
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      description: Refreshed daily. Administrator only. Storage is in bytes; new or empty bases may not yet appear.
      responses:
        '200':
          description: Cached totals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  number_of_bases: {type: integer}
                  total_rows: {type: number}
                  total_storage: {type: number}
              example: {number_of_bases: 1, total_rows: 100, total_storage: 4096}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/bases:
    get:
      tags: [Bases]
      operationId: listBaseStatistics
      summary: List base statistics
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      description: List cached base statistics. Administrator only. Empty pages return null.
      parameters:
        - {name: order-by, in: query, description: Sort by storage or rows descending. Omitted uses statistics-record creation order ascending., schema: {type: string, enum: [storage, rows]}}
        - {name: asc, in: query, description: Any positive integer enables ascending order for storage/rows sorting., schema: {type: integer, default: 0}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, description: Omitted or zero uses 10., schema: {type: integer, minimum: 0, default: 10}}
      responses:
        '200':
          description: Cached base page, or null if empty.
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  bases: {type: array, items: {$ref: '#/components/schemas/BaseStatistics'}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/{base_id}/base:
    post:
      tags: [Bases]
      operationId: createBase
      summary: Create a base
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      parameters:
        - name: base_id
          in: path
          required: true
          description: Client-generated lowercase UUID; creation does not accept a base name or template here.
          schema: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
      description: Create a base owned by the current user. An existing UUID returns 200 without changes.
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {name: {type: string, description: 'Optional globally unique name; cannot be blank, a UUID or template.'}}}
            example: {name: my-base}
      responses:
        '200': {description: Created or already exists; empty body.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Bases]
      operationId: deleteBase
      summary: Delete a base
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      parameters: [{$ref: '#/components/parameters/base_id'}]
      description: Delete a base and its data. Base owner or administrator only.
      responses:
        '200': {description: Deleted successfully; normally empty body.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/{base_id}/base-info:
    get:
      tags: [Bases]
      operationId: getBaseStatistics
      summary: Get base statistics
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      parameters: [{$ref: '#/components/parameters/base_id'}]
      description: Get cached daily statistics. Base owner or administrator only. Storage is in bytes.
      responses:
        '200':
          description: Cached base statistics.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BaseStatistics'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/{base_id}/metadata:
    get:
      tags: [Bases]
      operationId: getBaseMetadata
      summary: Get base metadata
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      parameters: [{$ref: '#/components/parameters/base_id'}]
      description: Get current schema. Base owner or administrator only. For row counts, use base-info or SELECT COUNT(*).
      responses:
        '200':
          description: Base schema and storage.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BaseMetadata'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/{base_id}/base/update-row-count:
    post:
      tags: [Bases]
      operationId: updateBaseRowCount
      summary: Recalculate base row counts
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      parameters: [{$ref: '#/components/parameters/base_id'}]
      description: Schedule row-count recalculation for all tables. Base owner or administrator only. Success confirms scheduling, not completion or a cached-statistics refresh.
      responses:
        '200':
          description: Recalculation scheduled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Success'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/{base_id}/base/update-base-owner:
    post:
      tags: [Bases]
      operationId: updateBaseOwner
      summary: Change the base owner
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      parameters: [{$ref: '#/components/parameters/base_id'}]
      description: Change the base owner to an existing user. Administrator only; an unknown user returns 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [username], properties: {username: {type: string}}}
            example: {username: user_example}
      responses:
        '200':
          description: Owner updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Success'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/{base_id}/base/update-base-id:
    post:
      tags: [Bases]
      operationId: updateBaseId
      summary: Change the base UUID
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      parameters: [{$ref: '#/components/parameters/base_id'}]
      description: Change the UUID to one not already in use. Administrator only. Obtain new JWTs after the change.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [base_id], properties: {base_id: {type: string, format: uuid}}}
      responses:
        '200':
          description: UUID updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Success'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/{base_id}/base/update-base-name:
    post:
      tags: [Bases]
      operationId: updateBaseName
      summary: Set or change the base name
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      parameters: [{$ref: '#/components/parameters/base_id'}]
      description: Set a globally unique base name without changing its UUID. Base owner or administrator only. The name cannot be empty string, a UUID or `template`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1}}}
            example: {name: my-renamed-base}
      responses:
        '200':
          description: Name updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Success'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}

  /api/v1/{base_id}/index/task:
    get:
      tags: [Indexes]
      operationId: getIndexTask
      summary: Get index task status
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/base_id'}
        - {name: task_id, in: query, description: 'Task UUID from index creation. If omitted, returns an active task for the base or its newest finished task.', schema: {type: string}}
      description: Get index task status. Base owner or administrator only; requires Basic or ApiKey. Finished tasks expire after roughly one hour.
      responses:
        '200':
          description: Task status.
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string, enum: [waiting, running, success, failure]}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/{base_id}/index/tasks:
    get:
      tags: [Indexes]
      operationId: listIndexTasks
      summary: List index tasks
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      parameters: [{$ref: '#/components/parameters/base_id'}]
      description: List retained index tasks for this base. Base owner or administrator only; requires Basic or ApiKey.
      responses:
        '200':
          description: Task list wrapped in tasks.
          content:
            application/json:
              schema: {type: object, properties: {tasks: {type: array, items: {$ref: '#/components/schemas/IndexTask'}}}}
              example: {tasks: []}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/requests:
    get:
      tags: [System]
      operationId: listActiveRequests
      summary: List active requests
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      description: List active requests, including this request. Administrator only.
      responses:
        '200':
          description: Requests currently executing on this server.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ActiveRequest'}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/stop-requests:
    post:
      tags: [System]
      operationId: stopRequest
      summary: Cancel a request
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      parameters: [{name: id, in: query, description: A single request_id from the active request list; not an array., schema: {type: string, format: uuid}}]
      description: Cancel an active request. Administrator only. Missing or unknown IDs are ignored.
      responses:
        '200': {description: Cancellation requested; empty body.}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/metrics:
    get:
      tags: [System]
      operationId: getMetrics
      summary: Get server metrics
      security: [{BasicAuth: []}, {APIKeyAuth: []}]
      description: Administrator only. JSON metrics on this server; request_count includes the metrics request itself.
      responses:
        '200':
          description: Server activity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_count: {type: integer}
                  index_adding_count: {type: integer, format: int64}
                  is_cleaning_base: {type: boolean}
              example: {request_count: 1, index_adding_count: 0, is_cleaning_base: false}
        '403': {$ref: '#/components/responses/Forbidden'}
  /ping:
    get:
      tags: [System]
      operationId: ping
      summary: Ping
      security: []
      description: Check server health. No authentication required.
      responses:
        '429': {$ref: '#/components/responses/RateLimited'}
        '200':
          description: Server responds.
          content:
            application/json:
              schema: {type: object, properties: {ret: {type: string, enum: [pong]}}}
              example: {ret: pong}

  /api/v1/{base_id}/query:
    post:
      tags:
        - Data
      operationId: executeSqlQuery
      summary: Execute SQL Query
      parameters:
        - $ref: '#/components/parameters/base_id'
      description: >-
        Execute SELECT, EXPLAIN, INSERT, REPLACE, UPDATE, DELETE or supported DDL
        (CREATE/DROP/ALTER TABLE and CREATE/DROP INDEX). Read result cells using
        metadata[].id. DML and most DDL return null results and metadata;
        CREATE INDEX returns results.task_id for asynchronous creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            example:
              sql: SELECT `_pk`, `name` FROM `Table1` WHERE `name` = ? LIMIT 10
              parameters: [Alice]
              convert_keys: true
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/Timeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/{base_id}/rows:
    post:
      tags:
        - Data
      operationId: insertRows
      summary: Insert rows
      parameters:
        - $ref: '#/components/parameters/base_id'
      description: >-
        Insert rows using column names and select-option names; unknown columns
        are ignored. JWT requires 'read-write' or 'all' permission. pks follows input order.
        replace=true creates new primary keys for matched rows. Errors may include
        partial-success pks and inserted_row_count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertRowsRequest'
            example:
              table_name: Table1
              rows: [{name: Alice}]
              replace: false
      responses:
        '200':
          description: Insert result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertRowsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transaction conflict; may include successfully inserted rows.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InsertRowsResponse'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Data
      operationId: updateRows
      summary: Batch update rows
      parameters:
        - $ref: '#/components/parameters/base_id'
      description: >-
        Update up to 1000 rows by primary key (`_pk`). Only supplied cells change;
        unknown columns are ignored. JWT requires 'read-write' or 'all' permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRowsRequest'
            example: {table_name: Table1, updates: [{pk: 1, row: {name: Bob}}]}
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Data
      operationId: deleteRows
      summary: Batch delete rows
      parameters:
        - $ref: '#/components/parameters/base_id'
      description: >-
        Delete rows by up to 10000 primary keys; missing keys are ignored.
        JWT requires 'read-write' or 'all' permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRowsRequest'
            example: {table_name: Table1, pks: [1, 2]}
      responses:
        '200':
          description: Delete result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRowsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/{base_id}/tables:
    post:
      tags:
        - Tables
      operationId: createTable
      summary: Create a table
      description: >-
        Create a table, optionally using a template table's schema.
        table_name must be nonempty and cannot contain *. JWT requires 'all' permission.
      parameters:
        - $ref: '#/components/parameters/base_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
      responses:
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: Created table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTableResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Tables
      operationId: deleteTable
      summary: Delete a table
      parameters:
        - $ref: '#/components/parameters/base_id'
      description: Delete a table by ID or name. JWT requires 'all' permission. Template tables cannot be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableIdentifier'
      responses:
        '200':
          description: Delete result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Tables
      operationId: updateTable
      summary: Update a table
      parameters:
        - $ref: '#/components/parameters/base_id'
      description: Rename a table. Duplicate names return 400. JWT requires 'all' permission on both the current and new table names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTableRequest'
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/{base_id}/tables/update-row-count:
    post:
      tags:
        - Tables
      operationId: updateTableRowCount
      summary: Update a table's row count
      description: Recalculate the number of rows in the table. JWT requires 'all' permission.
      parameters:
        - $ref: '#/components/parameters/base_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableIdentifier'
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/{base_id}/columns:
    post:
      tags:
        - Columns
      operationId: createColumn
      summary: Create a column
      parameters:
        - $ref: '#/components/parameters/base_id'
      description: >-
        Create a column with optional type-specific settings in column_data.
        JWT requires 'all' permission. Template-managed schema changes return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateColumnRequest'
      responses:
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: Created column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateColumnResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Columns
      operationId: deleteColumn
      summary: Delete a column
      description: Delete a column and its indexes. JWT requires 'all' permission. Unknown columns are ignored; template-managed schema changes return 400.
      parameters:
        - $ref: '#/components/parameters/base_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnIdentifier'
      responses:
        '200':
          description: Delete result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Columns
      operationId: updateColumn
      summary: Update a column
      parameters:
        - $ref: '#/components/parameters/base_id'
      description: Update a column name or selected data keys; type cannot change. JWT requires 'all' permission. Bound tables allow data overrides but reject renaming. Missing columns return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateColumnRequest'
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/{base_id}/columns/copy:
    post:
      tags:
        - Columns
      operationId: copyColumn
      summary: Copy a column
      parameters:
        - $ref: '#/components/parameters/base_id'
      description: Copy a column's metadata and values. JWT requires 'all' permission. Missing source, duplicate destination and template-managed schema return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyColumnRequest'
      responses:
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: Created column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyColumnResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/{base_id}/column-options:
    post:
      tags:
        - Single/Multiple Select Options
      operationId: createColumnOption
      summary: Add a single/multiple select option
      parameters:
        - $ref: '#/components/parameters/base_id'
      description: >-
        Add an option to a single-select or multiple-select column, or return an existing option's ID.
        Use `option_data` to configure optional attributes (`color`, `text_color`).
        JWT requires 'all' permission. Tables bound to a template will locally override the select options in the template. The template is not affected.
        Missing columns return 400; non-select columns return 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOptionRequest'
      responses:
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: Created option
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Single/Multiple Select Options
      operationId: deleteColumnOption
      summary: Delete single/multiple select options
      parameters:
        - $ref: '#/components/parameters/base_id'
      description: >-
        Delete select options from a single-select or multiple-select column by ID or name. JWT requires 'all' permission.
        Tables bound to a template will locally override the select options in the template. The template is not affected.
        Missing columns/options are ignored; non-select columns return 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOptionsRequest'
      responses:
        '200':
          description: Delete result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Single/Multiple Select Options
      operationId: updateColumnOption
      summary: Update a single/multiple select option
      parameters:
        - $ref: '#/components/parameters/base_id'
      description: >-
        Update a single-select or multiple-select option's name or optional attributes (`color`, `text_color`).
        Only supplied attributes in `update_option_data` are updated; `id` cannot be modified, and `name` must be updated via `new_option_name`.
        JWT requires 'all' permission. Tables bound to a template will locally override the select options in the template. The template is not affected.
        Missing columns return 400; missing options, duplicate names and non-select columns return 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOptionRequest'
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/{base_id}/index:
    post:
      tags:
        - Indexes
      operationId: createIndex
      summary: Create an index
      parameters:
        - $ref: '#/components/parameters/base_id'
      description: >-
        Create an index on one or more columns. JWT requires 'all' permission. Async creation
        returns task_id; sync creation returns an empty task_id. Duplicate/running
        indexes, missing tables and template-managed schema return 400;
        missing columns may return 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIndexRequest'
      responses:
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: Index creation task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIndexResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Indexes
      operationId: deleteIndex
      summary: Delete a column index
      description: Delete an index using index_id from base metadata. JWT requires 'all' permission. Missing indexes are ignored; missing tables and template-managed schema return 400.
      parameters:
        - $ref: '#/components/parameters/base_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteIndexRequest'
      responses:
        '200':
          description: Delete result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
